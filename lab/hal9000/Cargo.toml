[package]
name = "hal9000"
version = "0.1.0"
edition = "2024"
description = "An intelligent security analysis tool implemented as an MCP server for multi-tenant log analysis"
authors = ["Nicolas Remise <nicolasremise@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nesimer/talks/lab/hal9000"
keywords = ["security", "elasticsearch", "mcp", "analysis", "logging"]
categories = ["command-line-utilities", "web-programming::http-client"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]
exclude = ["data/**", "target/**"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "fmt"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
rmcp = { version = "0.6.1", features = [
    "server",
    "macros",
    "transport-sse-server",
    "transport-io",
    "transport-streamable-http-server",
    "auth",
    "elicitation",
    "schemars",
] }
chrono = "0.4.41"
